# Optional independent editor service. Keep the image digest fixed when validating.
# Production: set AIDE_COLLABORA_IMAGE to your supported Collabora image and put
# this loopback HTTP listener behind your existing HTTPS reverse proxy.
services:
  collabora:
    image: ${AIDE_COLLABORA_IMAGE:-registry-1.docker.io/collabora/code@sha256:95f29f1c0a1778999125f53f058d968fe0afb37c95e32ebfb9f3444140faebd2}
    ports:
      - "127.0.0.1:${AIDE_COLLABORA_PORT:-19980}:9980"
    environment:
      aliasgroup1: ${AIDE_COLLABORA_CALLBACK_ORIGIN:?Set the exact Aide callback origin, including scheme and port}
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:logging.level=warning
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: ${AIDE_COLLABORA_MEMORY:-2g}
    cpus: ${AIDE_COLLABORA_CPUS:-2}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
