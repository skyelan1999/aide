name: aide
services:
  aide:
    image: ${AIDE_IMAGE:-aide:local}
    # 双保险：已导入镜像后绝不联网 pull。缺镜像立即报错，而非挂起等待拉取。
    # 离线/空气 gap 机只 docker load + start-image；此处 never 防止裸跑 compose up 意外拉取。
    pull_policy: never
    init: true
    user: "${AIDE_RUN_UID:-1000}:${AIDE_RUN_GID:-1000}"
    build:
      context: .
      dockerfile: ${AIDE_DOCKERFILE:-Dockerfile}
      network: ${AIDE_BUILD_NETWORK:-default}
      args:
        AIDE_CAD_IMAGE: ${AIDE_CAD_IMAGE:-aide:cad-dependencies-v1}
        AIDE_DEPENDENCY_IMAGE: ${AIDE_DEPENDENCY_IMAGE:-aide:dependencies-v1}
        AIDE_VERSION: ${AIDE_VERSION:-dev}
        AIDE_COMMIT: ${AIDE_COMMIT:-unknown}
        # #43：默认 start 不跑全量 go test（仅 vet+build，层缓存秒级）；
        # 发布门禁（scripts/docker-release.sh / CI）必须显式置 1 强制跑全量测试。
        AIDE_RUN_TESTS: ${AIDE_RUN_TESTS:-0}
        # #43：由 scripts/aide.sh start 计算的 Go 源码哈希，写进镜像 label aide.srcsha，供快捷路径比对。
        AIDE_SRC_SHA: ${AIDE_SRC_SHA:-unknown}
        # #46：pip 依赖源；离线/air-gap 首次构建先 scripts/prebuild-wheels.sh 再置 PIP_OFFLINE=1。
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_OFFLINE: ${PIP_OFFLINE:-0}
    ports:
      # 容器内 8080 现为 HTTPS（自签证书自动生成）；宿主机仅回环绑定。
      # 8081 明文跳转端口不向宿主机暴露，用户直接用 https://localhost:${AIDE_PORT} 访问。
      - "127.0.0.1:${AIDE_PORT:-8097}:8080"
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AIDE_HOST_LOCAL: ${AIDE_LOCAL_ROOT:-$HOME}
      # 在线搜索端点（SearXNG 兼容 JSON）。留空=离线优雅降级（web_search 提示用 search_text 搜本地，不发外联）。
      # 联网部署填公开/自建实例以恢复 DuckDuckGo 在线搜索能力；空气 gap 机务必留空。
      AIDE_WEBSEARCH_URL: ${AIDE_WEBSEARCH_URL:-}
      AIDE_BROWSER_BRIDGE_TOKEN: ${AIDE_BROWSER_BRIDGE_TOKEN:-}
      AIDE_CAD_URL: http://cad:8082
      AIDE_COMPUTER_BRIDGE_TOKEN: ${AIDE_COMPUTER_BRIDGE_TOKEN:-}
    volumes:
      - type: bind
        source: ${AIDE_WORKSPACE:-.}
        target: /workspace
      - type: bind
        source: ${AIDE_CONTEXT:-../Harness}
        target: /context
        read_only: true
      - type: bind
        source: ${AIDE_LOCAL_ROOT:-$HOME}
        target: /local
      - type: bind
        source: ./.aide-data/storage/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./.aide-data/storage/home
        target: /home/aide
        bind:
          create_host_path: false
    networks: [default, cad-private]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2

  cad:
    depends_on:
      aide:
        condition: service_healthy
    image: ${AIDE_IMAGE:-aide:local}
    pull_policy: never
    init: true
    user: "${AIDE_RUN_UID:-1000}:${AIDE_RUN_GID:-1000}"
    entrypoint: ["python3", "/opt/aide/cad/server.py"]
    environment:
      PYTHONPATH: /opt/aide-cad
      LD_LIBRARY_PATH: /opt/aide-cad/system
    volumes:
      - type: bind
        source: ./.aide-data/storage/data/cad-auth
        target: /cad-auth
        read_only: true
        bind:
          create_host_path: false
    networks: [cad-private]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 4g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      disable: true
networks:
  cad-private:
    internal: true
