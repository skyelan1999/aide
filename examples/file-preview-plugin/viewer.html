<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBJ 插件预览</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;background:#202729;color:#e6eeed;padding:18px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}#status{color:#a9c1bd;font-size:12px}.views{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}canvas{width:100%;height:350px;display:block;background:#171f21;border-radius:12px}textarea{width:100%;height:350px;background:#171f21;color:#e6eeed;border:1px solid #445955;border-radius:12px;padding:12px;font:12px/1.5 monospace}button{padding:9px 14px;border:1px solid #779e94;border-radius:8px;background:#29463e;color:#e6eeed;cursor:pointer}button:disabled{opacity:.5}label{display:flex;align-items:center;gap:10px;font-size:12px}small{display:block;color:#9bb2ac;margin:12px 0}@media(max-width:650px){.views{grid-template-columns:1fr}canvas,textarea{height:260px}}</style>
<header><h1>插件 · OBJ 线框</h1><span id="status" role="status">等待文件桥…</span><button id="prepare" disabled>准备保存修改</button></header><small>协议示例：读取当前文件、旋转线框、编辑 OBJ 文本。准备后还需点击宿主「保存到原文件」。</small><label>旋转 <input id="angle" type="range" min="0" max="360" value="30"></label><main class="views"><canvas id="canvas" width="800" height="600" aria-label="OBJ 线框预览"></canvas><textarea readonly id="editor" aria-label="OBJ 源文件" spellcheck="false"></textarea></main><script>'use strict';
// Bundle this source into a plugin HTML. Never load parent credentials or arbitrary host URLs.
(function(){
 function create(pluginId){
  if(typeof pluginId!=='string'||!/^[A-Za-z0-9_-]{1,64}$/.test(pluginId))throw Error('Invalid plugin id');
  let port=null,tools=[],capabilities=[],next=0,connecting=null,settle=null,closed=false;const pending=new Map(),listeners=new Set();
  const revoke=reason=>{closed=true;port?.close();port=null;for(const p of pending.values()){clearTimeout(p.timer);p.reject(Error(reason));}pending.clear();if(settle){settle.reject(Error(reason));clearTimeout(settle.timer);settle=null;}window.removeEventListener('message',receive);};
  function receive(e){const m=e.data;if(closed||port||e.source!==window.parent||m?.type!=='aide.workbench.connect'||m.protocol!==1||m.pluginId!==pluginId||!Array.isArray(m.tools)||m.tools.some(x=>typeof x!=='string')||e.ports?.length!==1)return;
   port=e.ports[0];tools=m.tools.slice();capabilities=Array.isArray(m.capabilities)?m.capabilities.filter(x=>typeof x==='string').slice(0,16):[];port.onmessage=event=>{const value=event.data;if(value?.event==='scope.revoked'){revoke('Host scope revoked; verify effects before retry');for(const listener of listeners){try{listener(value);}catch(_){}}return;}if(value?.event){for(const listener of listeners)listener(value);return;}const p=pending.get(value?.requestId);if(!p)return;pending.delete(value.requestId);clearTimeout(p.timer);if(value.status==='error')p.reject(Error(value.error||'Host call failed'));else p.resolve(value);};port.start();clearTimeout(settle?.timer);settle?.resolve({protocol:1,tools:tools.slice(),capabilities:capabilities.slice()});settle=null;
  }
  window.addEventListener('message',receive);
  function connect(){if(closed)return Promise.reject(Error('Client closed'));if(port)return Promise.resolve({protocol:1,tools:tools.slice(),capabilities:capabilities.slice()});if(!connecting){connecting=new Promise((resolve,reject)=>{settle={resolve,reject,timer:setTimeout(()=>revoke('Host bridge unavailable'),10000)};});window.parent.postMessage({type:'aide.workbench.ready',protocol:1,requestIds:'monotonic'},'*');}return connecting;}
  async function request(method,body){await connect();if(closed||!port)throw Error('Bridge closed');if(pending.size)throw Error('A call is already pending');const requestId='r_'+(++next);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(requestId);reject(Error('Reply timeout; outcome uncertain, do not automatically retry'));},320000);pending.set(requestId,{resolve,reject,timer});try{port.postMessage({protocol:1,requestId,method,...body});}catch(e){pending.delete(requestId);clearTimeout(timer);reject(e);}});}
  return {connect,
   workflow:args=>request('workflow.control',{arguments:args}),
   capture:args=>request('capture.control',{arguments:args}),
   captureNetwork:args=>request('capture.network',{arguments:args}),
   projectMessages:args=>request('project.messages',{arguments:args}),
   fileTarget:path=>request('file.target',{arguments:{path}}),
   saveFile:(path,content,hash)=>request('file.save',{arguments:{path,content,hash}}),
   documentInfo:(asset='',options={})=>request('document.info',{arguments:{asset,metadataOnly:options.metadataOnly===true}}),
   readDocument:(args={})=>request('document.read',{arguments:args}),
   pluginAssetInfo:(asset,options={})=>request('document.package.info',{arguments:{asset,metadataOnly:options.metadataOnly===true}}),
   readPluginAsset:(args={})=>request('document.package.read',{arguments:args}),
   failDocumentPreview:()=>request('document.error',{arguments:{}}),
   setDocumentDirty:dirty=>request('document.dirty',{arguments:{dirty:dirty===true}}),
   abortDocumentSave:()=>request('document.save.abort',{arguments:{}}),
   beginDocumentSave:(size,version)=>request('document.save.begin',{arguments:{size,version}}),
   writeDocumentChunk:(offset,bytes)=>{if(!(bytes instanceof Uint8Array)||bytes.byteLength>524288)throw Error('Expected Uint8Array of at most 512KiB');let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return request('document.save.chunk',{arguments:{offset,data:btoa(binary)}});},
   requestDocumentSave:()=>request('document.save.request',{arguments:{}}),

   async saveDocument(bytes,version){if(!(bytes instanceof Uint8Array))throw Error('Expected Uint8Array');await request('document.save.begin',{arguments:{size:bytes.byteLength,version}});for(let offset=0;offset<bytes.byteLength;offset+=524288){const chunk=bytes.subarray(offset,offset+524288);let binary='';for(let i=0;i<chunk.length;i+=8192)binary+=String.fromCharCode(...chunk.subarray(i,i+8192));await request('document.save.chunk',{arguments:{offset,data:btoa(binary)}});}return request('document.save.request',{arguments:{}});},
   async call(tool,args={},attachments=[]){await connect();if(!tools.includes(tool))throw Error('Tool not declared by this workbench');return request('tool.call',{tool,arguments:args,attachments});},proposalStatus:proposalId=>request('proposal.status',{proposalId}),onEvent(fn){listeners.add(fn);return()=>listeners.delete(fn);},close(){revoke('Client closed; verify effects before retry');}};
 }
 window.AideWorkbenchClient={create};
})();
</script><script>
'use strict';
const client=AideWorkbenchClient.create('mesh-file-preview'),$=id=>document.getElementById(id);let version='',vertices=[],edges=[],editable=false;let operations=Promise.resolve();const enqueue=fn=>{const result=operations.then(fn);operations=result.catch(()=>{});return result;};
const OBJ_LIMITS=Object.freeze({bytes:8*1024*1024,lineChars:65536,vertices:100000,records:100000,indices:2048,edges:100000});
function objLimit(){const e=Error('示例模型超过预览限制，请使用完整查看器');e.code='AIDE_OBJ_LIMIT';throw e;}
function parse(text){
 vertices=[];edges=[];
 if(text.length>OBJ_LIMITS.bytes||new TextEncoder().encode(text).byteLength>OBJ_LIMITS.bytes)objLimit();
 const nextVertices=[],nextEdges=[];let records=0;
 for(let start=0;start<text.length;){
  let end=text.indexOf('\n',start);if(end<0)end=text.length;
  if(end-start>OBJ_LIMITS.lineChars)objLimit();
  const parts=text.slice(start,end).trim().split(/\s+/);start=end+1;
  if(parts[0]==='v'){
   if(nextVertices.length>=OBJ_LIMITS.vertices)objLimit();
   const v=parts.slice(1,4).map(Number);
   if(v.length!==3||v.some(x=>!Number.isFinite(x)))throw Error('invalid vertex');
   nextVertices.push(v);
  }
  if(parts[0]==='f'||parts[0]==='l'){
   if(++records>OBJ_LIMITS.records||parts.length-1>OBJ_LIMITS.indices)objLimit();
   const count=Math.max(0,parts.length-2)+(parts[0]==='f'&&parts.length>3?1:0);
   if(count>OBJ_LIMITS.edges-nextEdges.length)objLimit();
   const face=parts.slice(1).map(x=>{const slash=x.indexOf('/'),n=Number(slash<0?x:x.slice(0,slash));return n<0?nextVertices.length+n:n-1;});
   if(face.some(n=>!Number.isInteger(n)||n<0||n>=nextVertices.length))throw Error('invalid face');
   for(let i=0;i<face.length-1;i++)nextEdges.push([face[i],face[i+1]]);
   if(parts[0]==='f'&&face.length>2)nextEdges.push([face.at(-1),face[0]]);
  }
 }
 if(!nextVertices.length)throw Error('unsupported model');
 vertices=nextVertices;edges=nextEdges;
}
function draw(){const canvas=$('canvas'),ctx=canvas.getContext('2d'),angle=Number($('angle').value)*Math.PI/180;ctx.clearRect(0,0,canvas.width,canvas.height);if(!vertices.length)return;const min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(const v of vertices)for(let i=0;i<3;i++){min[i]=Math.min(min[i],v[i]);max[i]=Math.max(max[i],v[i]);}const center=min.map((v,i)=>(v+max[i])/2),size=Math.max(...min.map((v,i)=>max[i]-v),.001);const points=vertices.map(v=>{const x=(v[0]-center[0])/size,y=(v[1]-center[1])/size,z=(v[2]-center[2])/size;return[400+(x*Math.cos(angle)+z*Math.sin(angle))*400,300+(-y*.85+(z*Math.cos(angle)-x*Math.sin(angle))*.3)*400];});ctx.strokeStyle='#97cbb9';ctx.lineWidth=2;ctx.beginPath();for(const [a,b]of edges){ctx.moveTo(...points[a]);ctx.lineTo(...points[b]);}ctx.stroke();}
$('angle').oninput=draw;
$('editor').oninput=()=>{if(editable)void enqueue(()=>client.setDocumentDirty(true)).catch(e=>$('status').textContent=e.message);try{parse($('editor').value);draw();$('prepare').disabled=!editable;$('status').textContent='尚未保存';}catch(e){draw();$('prepare').disabled=true;$('status').textContent=e.code==='AIDE_OBJ_LIMIT'?e.message:'模型语法待修正';}};
$('prepare').onclick=async()=>{try{parse($('editor').value);$('prepare').disabled=true;$('editor').readOnly=true;const bytes=new TextEncoder().encode($('editor').value);await enqueue(()=>client.saveDocument(bytes,version));$('status').textContent='等待宿主保存确认';}catch(e){$('status').textContent=e.message;$('prepare').disabled=!editable;$('editor').readOnly=!editable;}};
client.onEvent(e=>{if(e.event==='document.saved'){version=e.result.version;$('status').textContent='已保存';$('prepare').disabled=!editable;$('editor').readOnly=!editable;}});
(async()=>{try{const info=(await client.documentInfo()).result;version=info.version;editable=info.editable;if(info.size>8*1024*1024)throw Error('示例模型超过8MiB，请使用完整查看器');const bytes=new Uint8Array(info.size);for(let offset=0;offset<info.size;){const result=(await client.readDocument({offset})).result;const data=Uint8Array.from(atob(result.data),c=>c.charCodeAt(0));bytes.set(data,offset);offset+=data.length;if(!data.length)throw Error('empty range');}const text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);parse(text);$('editor').value=text;$('editor').readOnly=!editable;$('prepare').disabled=!editable;draw();$('status').textContent=editable?'可编辑 · '+info.path:'只读 · '+info.path;}catch(e){$('status').textContent=e.message;try{await client.failDocumentPreview();}catch(_){}}})();
</script></html>
