name: Aide Delivery
on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Full release candidate, or host-only repair verification (never publishes)'
        type: choice
        default: full
        options: [full, hosts, browser]
      release_tag:
        description: 'Leave empty for candidate only; otherwise an existing version.sh tag on main'
        required: false
        type: string
      cadence_exception_reason:
        description: 'Optional one-off reason to publish before the normal 7-day cadence; manual dispatch only'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: aide-delivery-${{ github.ref }}-${{ inputs.validation_scope || 'full' }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'skyelan1999/aide' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.release_tag == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate trusted main source and requested tag
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CADENCE_EXCEPTION_REASON: ${{ inputs.cadence_exception_reason }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATION_SCOPE: ${{ inputs.validation_scope || 'full' }}
        run: python3 scripts/ci/delivery_gate.py source
      - name: Recheck current source contracts
        run: |
          python3 scripts/agent-route.py verify quick
          node scripts/ci/browser-navigation-errors.test.cjs
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
  native:
    if: inputs.validation_scope != 'hosts' && inputs.validation_scope != 'browser'
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Free disposable hosted runner SDK space
        run: |
          test "$GITHUB_ACTIONS" = true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build and verify Aide-only native candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/build_candidate.py --arch ${{ matrix.arch }} --out .agent-state/ci-candidate/${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aide-candidate-${{ matrix.arch }}
          path: |
            .agent-state/ci-candidate/${{ matrix.arch }}/*-full-linux-*.zip
            .agent-state/ci-candidate/${{ matrix.arch }}/*-devtools-linux-*.zip
            .agent-state/ci-candidate/${{ matrix.arch }}/candidate-proof.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-public-plugins-${{ matrix.arch }}
          path: |
            .agent-state/public-plugins/${{ matrix.arch }}/report.json
            .agent-state/public-plugins/${{ matrix.arch }}/functions.json
            .agent-state/public-plugins/${{ matrix.arch }}/functions.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-go-${{ matrix.arch }}
          path: .agent-state/native-verification/${{ matrix.arch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  launcher:
    if: inputs.validation_scope != 'hosts' && inputs.validation_scope != 'browser'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Real clean Linux launcher build and complete lifecycle
        run: |
          acceptance_root="$RUNNER_TEMP/aide launcher clean 中文"
          git worktree add --detach "$acceptance_root" HEAD
          python3 scripts/test_launcher_clean_environment.py --root "$acceptance_root" --evidence "$GITHUB_WORKSPACE/.agent-state/launcher-clean-linux" --allow-real-build --pip-index-url https://pypi.org/simple
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: clean-linux-launcher-acceptance
          path: |
            .agent-state/launcher-clean-linux/result.json
            .agent-state/launcher-clean-linux/*.log
          include-hidden-files: true
          retention-days: 30
  windows:
    if: inputs.validation_scope != 'browser'
    needs: source
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Native Windows, both PowerShell generations and relay boundaries
        run: python scripts/ci/host_validation.py --host windows --out .agent-state/host-validation/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-host-windows
          path: .agent-state/host-validation/windows
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  macos:
    if: inputs.validation_scope != 'browser'
    needs: source
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Native host helpers, launcher contracts and isolated signed Swift bridge
        run: python3 scripts/ci/host_validation.py --host macos --out .agent-state/host-validation/${{ matrix.runner }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-host-${{ matrix.runner }}
          path: .agent-state/host-validation/${{ matrix.runner }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  browser:
    if: inputs.validation_scope != 'hosts'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned browser runtime and all three engines
        run: |
          npm ci --prefix scripts/browser-runtime
          scripts/browser-runtime/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Real isolated app cross-browser regression
        env:
          AIDE_RELEASE_BROWSER: '1'
          AIDE_EVIDENCE_DIR: ${{ github.workspace }}/.agent-state/release-browser
        run: go test -mod=vendor -count=1 -timeout=20m -v ./internal/server -run '^TestReleaseBrowserMatrix$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-browser
          path: .agent-state/release-browser
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  public_plugins:
    if: inputs.validation_scope != 'hosts' && inputs.validation_scope != 'browser'
    needs: [source, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-public-plugins-*
          path: .agent-state/public-plugin-reports
      - name: Require every frozen public package installation and function result on both architectures
        env:
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/ci/public_plugins.py verify --root .agent-state/public-plugin-reports
  publish:
    if: always() && inputs.validation_scope != 'hosts' && inputs.validation_scope != 'browser' && needs.source.outputs.publish == 'true' && needs.source.result == 'success' && needs.native.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.browser.result == 'success' && needs.launcher.result == 'success' && needs.public_plugins.result == 'success'
    needs: [source, native, windows, macos, browser, launcher, public_plugins]
    concurrency:
      group: aide-public-release
      cancel-in-progress: false
    environment: aide-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_CADENCE_EXCEPTION_REASON: ${{ inputs.cadence_exception_reason }}
      GH_EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: aide-candidate-*
          path: .agent-state/delivery
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-host-*
          path: .agent-state/delivery
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-browser
          path: .agent-state/delivery/release-browser
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clean-linux-launcher-acceptance
          path: .agent-state/delivery/clean-linux-launcher-acceptance
      - name: Verify both architectures and prepare checksums
        run: python3 scripts/ci/delivery_gate.py artifacts --root .agent-state/delivery
      - name: Create a new draft only
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refuse overwrite.' >&2
            exit 1
          fi
          python3 scripts/ci/delivery_gate.py cadence
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --draft --prerelease --title "aide $RELEASE_TAG" --notes-file .agent-state/delivery/RELEASE-NOTES.md
          gh release upload "$RELEASE_TAG" .agent-state/delivery/aide-candidate-*/*.zip .agent-state/delivery/SHA256SUMS .agent-state/delivery/RELEASE-ASSETS.txt .agent-state/delivery/RELEASE-VALIDATION.json
      - name: Verify independently reported remote hashes before publication
        run: |
          python3 scripts/ci/delivery_gate.py remote --root .agent-state/delivery
          python3 scripts/ci/delivery_gate.py cadence
          gh release edit "$RELEASE_TAG" --draft=false
