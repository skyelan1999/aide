name: Aide CI
on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aide-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workflow syntax with pinned actionlint
        run: |
          mkdir -p .agent-state/actionlint
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o .agent-state/actionlint/archive.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  .agent-state/actionlint/archive.tar.gz' | sha256sum -c -
          tar -xzf .agent-state/actionlint/archive.tar.gz -C .agent-state/actionlint actionlint
          .agent-state/actionlint/actionlint -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Repository quick gate and CI contracts
        run: |
          python3 scripts/test_windows_native_host.py
          python3 scripts/test_windows_native_portable.py
          python3 scripts/agent-route.py verify quick
          node --test scripts/codex-host-control.test.cjs
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quick-failure
          path: .agent-state/verify-*.log
          include-hidden-files: true
          retention-days: 3
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile every package and run basic critical regressions
        run: python3 scripts/ci/basic_go.py
  gate:
    if: always()
    needs: [quick, go]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every basic check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(v['result'] == 'success' for v in results.values()), results
          PYTHON
