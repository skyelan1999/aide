name: OpenJPEG header rebuild evidence
on:
  push:
    branches: [test/openjpeg-header-rebuild-20261128]
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the defensive native patch with the pinned offline compiler
        run: |
          python3 scripts/openjpeg/build.py --work "${RUNNER_TEMP}/openjpeg-rebuild" --update
          mkdir -p "${RUNNER_TEMP}/openjpeg-evidence"
          cp "${RUNNER_TEMP}/openjpeg-rebuild/build-receipt.json" "${RUNNER_TEMP}/openjpeg-evidence/"
          cp internal/server/web/vendor/pdfjs/openjpeg/aide_openjpeg_nowasm_fallback.js "${RUNNER_TEMP}/openjpeg-evidence/"
      - name: Verify rebuilt decoder with normal JP2 and J2K inputs
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          base = Path("internal/server/web/vendor/pdfjs/openjpeg")
          manifest = base / "provenance.json"
          doc = json.loads(manifest.read_text())
          pins = json.loads(Path("scripts/openjpeg/pins.json").read_text())
          result = doc["localNativeBuild"]
          result["artifactSHA256"] = hashlib.sha256((base / result["artifact"]).read_bytes()).hexdigest()
          result.update({k: pins[k] for k in ("compiler", "core", "wrapper")})
          manifest.write_text(json.dumps(doc, indent=2) + "\n")
          PY
          node scripts/sync_pdf_openjpeg.cjs
          node scripts/sync_pdf_openjpeg.cjs --check
          node scripts/pdf-jp2-valid-container.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openjpeg-header-rebuild
          path: ${{ runner.temp }}/openjpeg-evidence
          if-no-files-found: error
          retention-days: 7
