name: Targeted Docker launcher verification (no release)
on:
  push:
    branches: [test/docker-launcher-1129]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Real clean Linux launcher build and complete lifecycle
        run: |
          acceptance_root="$RUNNER_TEMP/aide launcher clean 中文"
          git worktree add --detach "$acceptance_root" HEAD
          python3 scripts/test_launcher_clean_environment.py --root "$acceptance_root" --evidence "$GITHUB_WORKSPACE/.agent-state/launcher-clean-linux" --allow-real-build --pip-index-url https://pypi.org/simple
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: clean-linux-launcher-acceptance
          path: |
            .agent-state/launcher-clean-linux/result.json
            .agent-state/launcher-clean-linux/*.log
          include-hidden-files: true
          retention-days: 7
