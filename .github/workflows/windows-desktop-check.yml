name: Windows Desktop Check
on:
  push:
    branches: [main, 'feat/windows-desktop-*']
    paths:
      - 'native/windows-launcher/**'
      - 'scripts/build-windows-launcher.py'
      - 'scripts/windows_desktop*'
      - 'scripts/windows_stop*'
      - 'scripts/ci/windows_stop*'
      - 'scripts/ci/windows*desktop*'
      - '.github/workflows/windows-desktop-check.yml'
  pull_request:
    paths:
      - 'native/windows-launcher/**'
      - 'scripts/build-windows-launcher.py'
      - 'scripts/windows_desktop*'
      - 'scripts/windows_stop*'
      - 'scripts/ci/windows_stop*'
      - 'scripts/ci/windows*desktop*'
      - '.github/workflows/windows-desktop-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare existing cross-build paths
        run: |
          sudo mkdir -p /toolchain
          sudo chown "$USER" /toolchain
          sudo ln -s "$GITHUB_WORKSPACE" /src
      - name: Build Windows executable and separate UI fixture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          out="$GITHUB_WORKSPACE/.agent-state/windows-desktop"
          mkdir -p "$out"
          extra=()
          if [ "$TARGET_ARCH" = amd64 ]; then extra=(--desktop-test-output "$out/desktop-smoke.exe" --stop-test-output "$out/stop-recovery.exe"); fi
          python3 scripts/build-windows-launcher.py --in-container --arch "$TARGET_ARCH" --output "$out/aide-launcher.exe" "${extra[@]}"
          if [ "$TARGET_ARCH" = amd64 ]; then
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "$out/fixture.exe" scripts/ci/windows-desktop-fixture.go
            cp .agent-state/native-toolchain/WebView2Loader-amd64.dll "$out/WebView2Loader.dll"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-${{ matrix.arch }}
          path: .agent-state/windows-desktop/
          include-hidden-files: true
          retention-days: 3
  native-ui:
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-desktop-amd64
          path: .agent-state/windows-desktop
      - name: Actual Windows atomic state writes, process jobs and stop recovery
        shell: cmd
        run: python scripts/ci/windows_stop_recovery.py
      - name: Actual isolated WebView2 app tabs, sandbox port, dialogs and auth guard
        shell: cmd
        run: python scripts/ci/windows_desktop_ui.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-desktop-native-ui
          path: .agent-state/windows-desktop/
          include-hidden-files: true
          retention-days: 3
