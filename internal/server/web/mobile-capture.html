<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>扫码作业 · Aide</title><link rel="stylesheet" href="/mobile-capture.css"></head><body><main><header><span class="logo">P</span><div><small>AIDE · 安全采集</small><h1 id="title">连接扫码作业</h1></div><span id="connection" class="tag">等待配对</span></header><p id="notice" role="status">由电脑生成邀请。手机和电脑分别确认后，才能开始采集。</p><section id="join"><h2>配对设备</h2><label>设备名称<input id="device-name" maxlength="80" placeholder="例如：仓库手机 01" autocomplete="off"></label><button id="join-button">申请配对</button></section><section id="pair" hidden><h2>核对配对码</h2><p>确认电脑端显示相同的六位码，并在电脑上批准设备和分配区域。</p><strong id="pair-code" class="pair-code"></strong><button id="confirm-pair">手机确认配对</button><p id="pair-state"></p></section><section id="work" hidden><div class="row"><h2 id="mode">扫码采集</h2><span id="zone" class="tag"></span></div><div class="camera"><video id="video" playsinline muted></video><div class="target" aria-hidden="true"></div></div><div class="row"><button id="start-camera">启动后置摄像头</button><button id="stop-camera" class="secondary">关闭摄像头</button><label class="file-button">从照片识别<input id="photo" type="file" accept="image/*" capture="environment"></label></div><label>条码 / 二维码内容<input id="code" maxlength="128" autocomplete="off" autocapitalize="off" spellcheck="false"></label><p id="material">扫描后确认物料和数量，再提交。</p><label id="quantity-label">数量<input id="quantity" type="number" min="0" step="0.000001" value="1" inputmode="decimal"></label><button id="submit">确认并提交</button><button id="retry" class="secondary" hidden>重试同一笔提交</button><button id="correct" class="secondary" hidden>此笔已被拒绝，刷新后重新填写</button><p class="hint">识别和图像处理在本机完成，不上传照片。未同步记录仅保留在当前页面；网络异常时使用“重试”，不要重复新建一笔。</p></section><section id="records" hidden><h2>本区域记录</h2><div id="record-list"></div></section><footer>独立设备权限 · HTTPS · 电脑复核后入账<br>关闭工作台或撤销设备后，手机授权立即失效。</footer></main><script src="/vendor/mobile-capture/zxing-browser.min.js"></script><script src="/mobile-capture.js"></script></body></html>
