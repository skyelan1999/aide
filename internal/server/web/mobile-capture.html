<!doctype html><html lang="zh-CN"><head><script src="/settings-init.js?v=76"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title data-i18n="扫码作业 · Aide">扫码作业 · Aide</title><link rel="stylesheet" href="/mobile-capture.css"></head><body><main><header><span class="logo">P</span><div><small><span data-i18n="AIDE · 安全采集">AIDE · 安全采集</span></small><h1 id="title"><span data-i18n="连接扫码作业">连接扫码作业</span></h1></div><span id="connection" class="tag"><span data-i18n="等待配对">等待配对</span></span></header><p id="notice" role="status"><span data-i18n="由电脑生成邀请。手机和电脑分别确认后，才能开始采集。">由电脑生成邀请。手机和电脑分别确认后，才能开始采集。</span></p><section id="join"><h2><span data-i18n="配对设备">配对设备</span></h2><label><span data-i18n="设备名称">设备名称</span><input id="device-name" maxlength="80" placeholder="例如：仓库手机 01" autocomplete="off" data-i18n-placeholder="例如：仓库手机 01"></label><button id="join-button"><span data-i18n="申请配对">申请配对</span></button></section><section id="pair" hidden><h2><span data-i18n="核对配对码">核对配对码</span></h2><p><span data-i18n="确认电脑端显示相同的六位码，并在电脑上批准设备和分配区域。">确认电脑端显示相同的六位码，并在电脑上批准设备和分配区域。</span></p><strong id="pair-code" class="pair-code"></strong><button id="confirm-pair"><span data-i18n="手机确认配对">手机确认配对</span></button><p id="pair-state"></p></section><section id="work" hidden><div class="row"><h2 id="mode"><span data-i18n="扫码采集">扫码采集</span></h2><span id="zone" class="tag"></span></div><div class="row"><label class="position-field"><span data-i18n="作业区域">作业区域</span><select id="select-zone" aria-label="作业区域" data-i18n-aria-label="作业区域"></select></label><label class="position-field"><span data-i18n="货架 / 位置">货架 / 位置</span><select id="select-location" aria-label="货架 / 位置" data-i18n-aria-label="货架 / 位置"></select></label></div><p id="bound-person" class="tag"></p><div class="camera"><video id="video" playsinline muted></video><div class="target" aria-hidden="true"></div></div><div class="row"><button id="start-camera"><span data-i18n="启动后置摄像头">启动后置摄像头</span></button><button id="stop-camera" class="secondary"><span data-i18n="关闭摄像头">关闭摄像头</span></button><label class="file-button"><span data-i18n="从照片识别">从照片识别</span><input id="photo" type="file" accept="image/*" capture="environment"></label></div><label><span data-i18n="条码 / 二维码内容">条码 / 二维码内容</span><input id="code" maxlength="128" autocomplete="off" autocapitalize="off" spellcheck="false"></label><p id="material"><span data-i18n="扫描后确认物料和数量，再提交。">扫描后确认物料和数量，再提交。</span></p><label id="quantity-label"><span data-i18n="数量">数量</span><input id="quantity" type="number" min="0" step="0.000001" value="1" inputmode="decimal"></label><button id="submit"><span data-i18n="确认并提交">确认并提交</span></button><button id="retry" class="secondary" hidden><span data-i18n="重试同一笔提交">重试同一笔提交</span></button><button id="correct" class="secondary" hidden><span data-i18n="此笔已被拒绝，刷新后重新填写">此笔已被拒绝，刷新后重新填写</span></button><p class="hint"><span data-i18n="识别和图像处理在本机完成，不上传照片。未同步记录仅保留在当前页面；网络异常时使用“重试”，不要重复新建一笔。">识别和图像处理在本机完成，不上传照片。未同步记录仅保留在当前页面；网络异常时使用“重试”，不要重复新建一笔。</span></p></section><section id="records" hidden><h2><span data-i18n="本区域记录">本区域记录</span></h2><div id="record-list"></div></section><footer><span data-i18n="独立设备权限 · HTTPS · 电脑复核后入账">独立设备权限 · HTTPS · 电脑复核后入账</span><br><span data-i18n="关闭工作台或撤销设备后，手机授权立即失效。">关闭工作台或撤销设备后，手机授权立即失效。</span></footer></main><script src="/locales/en.js?v=165"></script><script src="/i18n.js?v=69"></script><script src="/vendor/mobile-capture/zxing-browser.min.js"></script><script src="/mobile-capture.js?v=3"></script></body></html>
