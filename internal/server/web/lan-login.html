<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Aide · 局域网登录</title><link rel="stylesheet" href="/lan-login.css"><script src="/lan-login.js" defer></script></head><body><main><div class="brand">aide.</div><h1>登录局域网工作台</h1><p>输入这台 Aide 的账户密码。扫码仅打开地址，每次登录都需要验证密码。</p><form id="lan-login-form"><label for="lan-password">账户密码</label><input id="lan-password" type="password" autocomplete="current-password" required maxlength="4096"><button type="submit">验证并登录</button><p id="lan-login-error" role="alert"></p></form><p class="hint">仅在同一局域网、已获本机授权时可用。请核对设备地址及本机显示的证书指纹。</p></main></body></html>
