name: aide-offline
services:
  aide:
    image: ${AIDE_IMAGE:?Use start.command or scripts/aide.sh start-bundle}
    pull_policy: never
    init: true
    user: "${AIDE_RUN_UID:-1000}:${AIDE_RUN_GID:-1000}"
    ports:
      - "127.0.0.1:${AIDE_PORT:-8097}:8080"
      - "127.0.0.1::45840"
      - "127.0.0.1::45841"
    environment:
      AIDE_MESSAGE_LAN_BRIDGE: /data/messages/lan-bridge
      AIDE_ASSISTANT_ENGINE: ${AIDE_ASSISTANT_ENGINE:-builtin}
      AIDE_ASSISTANT_TIMEZONE: ${AIDE_ASSISTANT_TIMEZONE:-UTC}
      AIDE_MIXSOUL_LOCAL_EMBEDDING: ${AIDE_MIXSOUL_LOCAL_EMBEDDING:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AIDE_HOST_LOCAL: ${AIDE_LOCAL_ROOT:-${PWD}/workspace}
      AIDE_WEBSEARCH_URL: ${AIDE_WEBSEARCH_URL:-}
      AIDE_BROWSER_BRIDGE_TOKEN: ${AIDE_BROWSER_BRIDGE_TOKEN:-}
      AIDE_COMPUTER_BRIDGE_TOKEN: ${AIDE_COMPUTER_BRIDGE_TOKEN:-}
    volumes:
      - type: bind
        source: ${AIDE_WORKSPACE:-./workspace}
        target: /workspace
      - type: bind
        source: ${AIDE_CONTEXT:-./context}
        target: /context
        read_only: true
      - type: bind
        source: ${AIDE_LOCAL_ROOT:-./workspace}
        target: /local
      - type: bind
        source: ./.aide-data/storage/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./.aide-data/storage/home
        target: /home/aide
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
