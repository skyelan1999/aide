name: aide-offline
services:
  aide:
    image: ${AIDE_IMAGE:?Use start.command or scripts/aide.sh start-bundle}
    pull_policy: never
    init: true
    ports:
      - "127.0.0.1:${AIDE_PORT:-8097}:8080"
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AIDE_HOST_LOCAL: ${AIDE_LOCAL_ROOT:-${PWD}/workspace}
      AIDE_WEBSEARCH_URL: ${AIDE_WEBSEARCH_URL:-}
    volumes:
      - type: bind
        source: ${AIDE_WORKSPACE:-./workspace}
        target: /workspace
      - type: bind
        source: ${AIDE_CONTEXT:-./context}
        target: /context
        read_only: true
      - type: bind
        source: ${AIDE_LOCAL_ROOT:-./workspace}
        target: /local
      - aide-data:/data
      - aide-home:/home/aide
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
volumes:
  aide-data:
  aide-home:
